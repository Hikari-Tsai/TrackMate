[project]
name = "stem-engine"
version = "0.99.7"
description = "Local engine: stem name / audio recognition (layers A-D), stereo analysis, model download and HTTP API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "soxr>=0.3",
    "rapidfuzz>=3.6",
    # onnxruntime 1.23.2 is the last release with an Intel macOS build (the universal app
    # ships an x86_64 engine next to the arm64 one).
    "onnxruntime>=1.20; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "tokenizers>=0.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "py-ptsl==602.0.0",
    "stereo-analysis",
]

[project.scripts]
stem-engine = "stem_engine.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
# Builds the standalone engine that ships inside the app (packaging/build_engine.py).
package = ["pyinstaller>=6.10"]

[tool.uv.sources]
stereo-analysis = { path = "../stereo_analysis", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stem_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
