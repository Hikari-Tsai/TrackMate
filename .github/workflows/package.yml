name: Package

# Builds TrackMate for macOS (one universal app for Apple Silicon and Intel) and Windows (x64)
# with the engine inside. Every push to main keeps the builds as workflow artifacts; a tag v*
# also publishes a release whose notes come from .github/release-notes.md.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      # The Intel engine is built with an x86_64 Python, which runs under Rosetta 2.
      - name: Rosetta 2
        run: arch -x86_64 /usr/bin/true || softwareupdate --install-rosetta --agree-to-license
      - name: Build engine and app
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TrackMate-macos
          path: dist/TrackMate-macos-*
          if-no-files-found: error

  windows:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - name: Build engine and app
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TrackMate-windows
          path: dist/TrackMate-windows-*
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes
        run: sed -e "s|{{TAG}}|${GITHUB_REF_NAME}|g" -e "s|{{REPO}}|${GITHUB_REPOSITORY}|g" .github/release-notes.md > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
